<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Recall at a ten percent task budget</title>
  <desc id="desc">Grouped bar chart comparing one-trace identity and two-trace frequency selection across four settings. Frequency gains are small: 6.1, 2.7, 0.8, and 9.0 percent relative.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18181b">Repeated traces did not create a strong selector</text>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="15" fill="#52525b">Recall at a 10% task-selection budget</text>
  <line x1="90" y1="400" x2="850" y2="400" stroke="#a1a1aa"/><line x1="90" y1="100" x2="90" y2="400" stroke="#a1a1aa"/>
  <g stroke="#e4e4e7"><line x1="90" y1="340" x2="850" y2="340"/><line x1="90" y1="280" x2="850" y2="280"/><line x1="90" y1="220" x2="850" y2="220"/><line x1="90" y1="160" x2="850" y2="160"/><line x1="90" y1="100" x2="850" y2="100"/></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#52525b"><text x="60" y="405">0.0</text><text x="60" y="345">0.1</text><text x="60" y="285">0.2</text><text x="60" y="225">0.3</text><text x="60" y="165">0.4</text><text x="60" y="105">0.5</text></g>
  <g fill="#a1a1aa"><rect x="145" y="137" width="45" height="263" rx="2"/><rect x="325" y="155" width="45" height="245" rx="2"/><rect x="505" y="183" width="45" height="217" rx="2"/><rect x="685" y="231" width="45" height="169" rx="2"/></g>
  <g fill="#4f46e5"><rect x="195" y="121" width="45" height="279" rx="2"/><rect x="375" y="148" width="45" height="252" rx="2"/><rect x="555" y="182" width="45" height="218" rx="2"/><rect x="735" y="215" width="45" height="185" rx="2"/></g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#18181b" text-anchor="middle"><text x="167" y="127">.439</text><text x="217" y="111">.465</text><text x="347" y="145">.409</text><text x="397" y="138">.420</text><text x="527" y="173">.361</text><text x="577" y="172">.364</text><text x="707" y="221">.282</text><text x="757" y="205">.308</text></g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#27272a" text-anchor="middle"><text x="192" y="427">Opus airline</text><text x="372" y="427">Opus telecom</text><text x="552" y="427">GPT airline</text><text x="732" y="427">GPT telecom</text></g>
  <rect x="565" y="448" width="14" height="14" fill="#a1a1aa"/><text x="585" y="460" font-family="Arial, sans-serif" font-size="13" fill="#27272a">one-trace identity</text><rect x="710" y="448" width="14" height="14" fill="#4f46e5"/><text x="730" y="460" font-family="Arial, sans-serif" font-size="13" fill="#27272a">two-trace frequency</text>
</svg>
