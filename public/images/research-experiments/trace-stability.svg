<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Tool-set stability across four identical agent runs</title>
  <desc id="desc">Bar chart showing the share of tasks with an identical tool set across four trials: Claude Opus 4.5 airline 24.0 percent, Claude Opus 4.5 telecom 44.7 percent, GPT-5.2 airline 16.0 percent, GPT-5.2 telecom 21.9 percent.</desc>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18181b">Tool-set stability across four identical runs</text>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="15" fill="#52525b">Share of tasks that used exactly the same tools in all four trials</text>
  <line x1="90" y1="400" x2="850" y2="400" stroke="#a1a1aa" stroke-width="1"/>
  <line x1="90" y1="130" x2="90" y2="400" stroke="#a1a1aa" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#52525b">
    <text x="58" y="405">0%</text><text x="50" y="320">15%</text><text x="50" y="235">30%</text><text x="50" y="150">45%</text>
  </g>
  <g stroke="#e4e4e7" stroke-width="1">
    <line x1="90" y1="315" x2="850" y2="315"/><line x1="90" y1="230" x2="850" y2="230"/><line x1="90" y1="145" x2="850" y2="145"/>
  </g>
  <g fill="#4f46e5">
    <rect x="160" y="264" width="110" height="136" rx="4"/><rect x="340" y="147" width="110" height="253" rx="4"/>
    <rect x="520" y="309" width="110" height="91" rx="4"/><rect x="700" y="276" width="110" height="124" rx="4"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#18181b">
    <text x="194" y="252">24.0%</text><text x="374" y="135">44.7%</text><text x="554" y="297">16.0%</text><text x="734" y="264">21.9%</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#27272a" text-anchor="middle">
    <text x="215" y="427">Opus 4.5</text><text x="215" y="445">airline</text>
    <text x="395" y="427">Opus 4.5</text><text x="395" y="445">telecom</text>
    <text x="575" y="427">GPT-5.2</text><text x="575" y="445">airline</text>
    <text x="755" y="427">GPT-5.2</text><text x="755" y="445">telecom</text>
  </g>
  <text x="90" y="480" font-family="Arial, sans-serif" font-size="14" fill="#52525b">Lower values mean that old traces are less complete evidence of a task's future tool use.</text>
</svg>
